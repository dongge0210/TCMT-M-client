<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCMT Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>TCMT <em>Viewer</em></h1>
    <div class="conn">
      <span id="connDot" class="dot"></span>
      <span id="connText">connecting…</span>
    </div>
    <select id="deviceSelect" title="选择设备"></select>
  </header>

  <main>
    <section class="device-strip" id="deviceStrip">
      <div class="strip-empty" id="stripEmpty">等待设备接入…（启动 TCMT-M --http 后自动出现）</div>
    </section>

    <section class="cards" id="cards">
      <article class="card">
        <h2>CPU</h2>
        <div class="gauge" id="cpuGauge">
          <div class="gauge-val"><span id="cpuUsage">--</span><small>%</small></div>
        </div>
        <div class="meta">
          <span>温度</span><b id="cpuTemp">--</b>
          <span>负载</span><b id="cpuLoad">--</b>
        </div>
        <canvas class="spark" id="sparkCpu"></canvas>
      </article>

      <article class="card">
        <h2>内存</h2>
        <div class="gauge" id="memGauge">
          <div class="gauge-val"><span id="memPct">--</span><small>%</small></div>
        </div>
        <div class="meta">
          <span>已用</span><b id="memUsed">--</b>
          <span>总计</span><b id="memTotal">--</b>
        </div>
        <canvas class="spark" id="sparkMem"></canvas>
      </article>

      <article class="card">
        <h2>GPU</h2>
        <div class="gauge" id="gpuGauge">
          <div class="gauge-val"><span id="gpuUsage">--</span><small>%</small></div>
        </div>
        <div class="meta">
          <span>温度</span><b id="gpuTemp">--</b>
          <span>状态</span><b id="gpuState">--</b>
        </div>
        <canvas class="spark" id="sparkGpu"></canvas>
      </article>

      <article class="card">
        <h2>运动传感器</h2>
        <table class="kv">
          <tr><td>加速度 ax / ay / az</td><td id="motionAcc">--</td></tr>
          <tr><td>角速度 gx / gy / gz</td><td id="motionGyro">--</td></tr>
          <tr><td>屏幕开合角</td><td id="motionLid">--</td></tr>
          <tr><td>采样率 / 心跳</td><td id="motionRate">--</td></tr>
        </table>
      </article>

      <article class="card">
        <h2>温度</h2>
        <ul id="tempList" class="temp-list"><li class="empty">暂无数据</li></ul>
      </article>

      <article class="card wide">
        <h2>传感器字段 <small id="fieldCount"></small></h2>
        <div class="table-wrap">
          <table class="fields" id="fieldTable">
            <thead><tr><th>字段</th><th>当前</th><th>最小</th><th>最大</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </article>
    </section>

    <section class="history">
      <div class="history-head">
        <h2>历史曲线</h2>
        <select id="fieldSelect" title="选择字段"></select>
        <label class="auto"><input type="checkbox" id="autoRefresh" checked /> 自动刷新</label>
        <span id="historyHint" class="hint"></span>
      </div>
      <canvas id="historyChart"></canvas>
    </section>
  </main>

  <footer>纯展示页面 · 数据来自 tcmt-server · 服务端地址 <span id="apiLabel"></span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
