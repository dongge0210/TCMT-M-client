# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# PRs target the integration branch (dev); main only receives dev→main merges.
# Note: Dependabot reads this file from the repository's DEFAULT branch (main),
# so these settings take effect once dev is merged into main.
version: 2
updates:
  # NuGet — the repo's only .NET project lives in /AvaloniaUI
  - package-ecosystem: "nuget"
    directory: "/AvaloniaUI"
    target-branch: "dev"
    schedule:
      interval: "weekly"       # 每周自动检查，可以改成 daily/monthly
    open-pull-requests-limit: 10

  # vcpkg 自动依赖更新（适用于 C++ 跨平台包管理器）
  - package-ecosystem: "vcpkg"
    directory: "/"             # 项目根目录
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions 自动更新（适用于 CI/CD 工作流）
  - package-ecosystem: "github-actions"
    directory: "/"             # .github/workflows 目录下的action
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
