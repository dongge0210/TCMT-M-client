name: Update PawnIO Modules

on:
  schedule:
    # Every Sunday at 03:17 UTC (off-peak, avoids :00/:30 stampede)
    - cron: '17 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get current version
        id: current
        run: echo "version=$(cat src/resources/pawnio/.version 2>/dev/null || echo "0.0.0")" >> "$GITHUB_OUTPUT"

      - name: Fetch latest PawnIO.Modules release
        id: latest
        run: |
          RELEASE_JSON="$(curl --fail --location --silent --show-error https://api.github.com/repos/namazso/PawnIO.Modules/releases/latest)"
          TAG="$(jq -er '.tag_name' <<< "$RELEASE_JSON")"
          SAFE_TAG="$(echo "$TAG" | tr '.' '_')"
          ARCHIVE="release_${SAFE_TAG}.zip"
          DIGEST="$(jq -er --arg archive "$ARCHIVE" '.assets[] | select(.name == $archive) | .digest | select(startswith("sha256:")) | sub("^sha256:"; "")' <<< "$RELEASE_JSON")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: check
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          echo "current=$CURRENT"
          echo "latest=$LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Update needed: $CURRENT → $LATEST"
          fi

      - name: Download and extract new .bin files
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          EXPECTED_SHA256: ${{ steps.latest.outputs.digest }}
        run: |
          SAFE_TAG="$(echo "$TAG" | tr '.' '_')"
          DOWNLOAD_URL="https://github.com/namazso/PawnIO.Modules/releases/download/${TAG}/release_${SAFE_TAG}.zip"
          echo "Downloading $DOWNLOAD_URL"
          curl --fail --location --silent --show-error "$DOWNLOAD_URL" -o /tmp/pawnio.zip
          COMPUTED_HASH="$(sha256sum /tmp/pawnio.zip | cut -d' ' -f1)"
          if [ "$COMPUTED_HASH" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA256 mismatch!"
            echo "  expected: $EXPECTED_SHA256"
            echo "  got:      $COMPUTED_HASH"
            exit 1
          fi
          echo "SHA256: $COMPUTED_HASH"
          # Validate archive contents before extracting
          unzip -l /tmp/pawnio.zip
          unzip -o /tmp/pawnio.zip "*.bin" -d src/resources/pawnio/
          echo "$TAG" > src/resources/pawnio/.version
          echo "$COMPUTED_HASH" > src/resources/pawnio/.sha256sum
          echo "Updated to $TAG"

      - name: Create Pull Request
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "deps: update PawnIO modules to ${{ steps.latest.outputs.tag }}"
          title: "deps: update PawnIO modules to ${{ steps.latest.outputs.tag }}"
          body: |
            Automated update of PawnIO kernel modules from
            [namazso/PawnIO.Modules](https://github.com/namazso/PawnIO.Modules).

            **${{ steps.current.outputs.version }} → ${{ steps.latest.outputs.tag }}**

            Source: https://github.com/namazso/PawnIO.Modules/releases/tag/${{ steps.latest.outputs.tag }}
          branch: deps/pawnio-${{ steps.latest.outputs.tag }}
          base: dev
          labels: dependencies
          delete-branch: true
